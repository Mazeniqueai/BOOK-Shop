<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" fill="none">
  <!-- Marque visuelle : livre ouvert stylisé -->
  <g transform="translate(8, 12)">
    <!-- Livre ouvert -->
    <path d="M 2 8 Q 2 4 6 4 L 16 4 Q 20 4 20 8 L 20 32 Q 20 36 16 36 L 6 36 Q 2 36 2 32 Z"
          fill="#6b2737" />
    <path d="M 20 8 Q 20 4 24 4 L 34 4 Q 38 4 38 8 L 38 32 Q 38 36 34 36 L 24 36 Q 20 36 20 32 Z"
          fill="#8a2a3d" />
    <!-- Lignes de pages -->
    <line x1="6" y1="12" x2="16" y2="12" stroke="#e8d5a3" stroke-width="0.8" opacity="0.7"/>
    <line x1="6" y1="16" x2="16" y2="16" stroke="#e8d5a3" stroke-width="0.8" opacity="0.7"/>
    <line x1="6" y1="20" x2="14" y2="20" stroke="#e8d5a3" stroke-width="0.8" opacity="0.5"/>
    <line x1="24" y1="12" x2="34" y2="12" stroke="#e8d5a3" stroke-width="0.8" opacity="0.7"/>
    <line x1="24" y1="16" x2="34" y2="16" stroke="#e8d5a3" stroke-width="0.8" opacity="0.7"/>
    <line x1="24" y1="20" x2="32" y2="20" stroke="#e8d5a3" stroke-width="0.8" opacity="0.5"/>
    <!-- Reliure centrale -->
    <line x1="20" y1="4" x2="20" y2="36" stroke="#4a1a25" stroke-width="0.5"/>
    <!-- Étoile dorée (signet) -->
    <circle cx="20" cy="28" r="2.5" fill="#c9a961"/>
  </g>

  <!-- Texte MAM -->
  <text x="56" y="40"
        font-family="Fraunces, Georgia, serif"
        font-size="28"
        font-weight="600"
        font-style="italic"
        fill="#1a1a1a"
        letter-spacing="-0.5">MAM</text>

  <!-- ++ en accent doré -->
  <text x="128" y="40"
        font-family="Fraunces, Georgia, serif"
        font-size="28"
        font-weight="700"
        fill="#c9a961"
        letter-spacing="-1">++</text>

  <!-- Tagline subtile sous le nom -->
  <text x="56" y="52"
        font-family="Inter, sans-serif"
        font-size="6"
        font-weight="500"
        fill="#8a8580"
        letter-spacing="2">L I B R A I R I E   N U M É R I Q U E</text>
</svg>
