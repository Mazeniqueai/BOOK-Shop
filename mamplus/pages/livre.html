<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MAM++</title>
  <link rel="icon" type="image/svg+xml" href="../images/favicon.svg" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>

  <header class="header">
    <nav class="nav">
      <a href="../index.html" class="logo" aria-label="MAM++">
        <img src="../images/logo.svg" alt="MAM++" class="logo-img" />
      </a>

      <ul class="nav-links">
        <li><a href="../index.html#catalogue" data-i18n="nav.catalog">Catalogue</a></li>
        <li><a href="../index.html#about" data-i18n="nav.about">À propos</a></li>
        <li><a href="../index.html#contact" data-i18n="nav.contact">Contact</a></li>
      </ul>

      <div style="display: flex; gap: 0.6rem; align-items: center;">
        <div class="lang-selector"></div>
        <button class="cart-btn" onclick="openCart()" aria-label="Cart">
          <span data-i18n="nav.cart">Panier</span>
          <span class="cart-count" data-count="0">0</span>
        </button>
        <button class="menu-toggle" onclick="toggleMenu()" aria-label="Menu">☰</button>
      </div>
    </nav>
  </header>

  <main>
    <section class="product-page" id="product-content"></section>
  </main>

  <footer class="footer">
    <div class="footer-content">
      <div class="footer-brand">
        <div class="logo">
          <img src="../images/logo.svg" alt="MAM++" class="logo-img logo-img--dark" />
        </div>
        <p data-i18n="footer.tagline">La librairie numérique.</p>
      </div>
      <div>
        <h4 data-i18n="footer.catalog">Catalogue</h4>
        <ul><li><a href="../index.html#catalogue" data-i18n="nav.catalog">Tous</a></li></ul>
      </div>
      <div>
        <h4 data-i18n="footer.help">Aide</h4>
        <ul><li><a href="#" data-i18n="nav.contact">Contact</a></li></ul>
      </div>
      <div>
        <h4 data-i18n="footer.legal">Légal</h4>
        <ul><li><a href="#">CGU</a></li></ul>
      </div>
    </div>
    <div class="footer-bottom">
      <div data-i18n="footer.copyright">© 2026 MAM++.</div>
    </div>
  </footer>

  <div class="cart-overlay" id="cart-overlay"></div>
  <aside class="cart-drawer" id="cart-drawer">
    <div class="cart-header">
      <h3 data-i18n="cart.title">Votre panier</h3>
      <button class="cart-close" onclick="closeCart()">×</button>
    </div>
    <div class="cart-items" id="cart-items"></div>
    <div class="cart-footer">
      <div class="cart-total">
        <span class="cart-total-label" data-i18n="cart.total">Total</span>
        <span class="cart-total-value" id="cart-total">0.00 €</span>
      </div>
      <a href="checkout.html" id="cart-checkout-btn" class="cart-checkout" data-i18n="cart.checkout" style="text-decoration: none; display: block; text-align: center;">
        Passer commande
      </a>
    </div>
  </aside>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>

  <script src="../js/firebase-config.js"></script>
  <script src="../js/i18n.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/books-service.js"></script>
  <script src="../js/main.js"></script>
</body>
</html>
